<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平均点のための計算機 | Holy App</title>
<meta name="description" content="数字を入れるだけで、合計・人数・平均がすぐ出る計算機。">
<!-- 参考: Linear / Vercel。暗い地色、細いボーダー、等幅の数字、グリッド。
     計算する道具なので、感情を足さずに精度と速さの印象へ寄せる。 -->
<style>
:root {
  --bg: #1c1c1f;
  --panel: #232327;
  --fg: #f4f4f6;
  --fg-soft: #9b9ba3;
  --line: rgba(255, 255, 255, 0.1);
  --accent: #7c8cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 940px; margin-inline: auto; padding-inline: 1.5rem; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

.nav { border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 54px; }
.nav a { text-decoration: none; font-size: 0.82rem; }
.nav .home { color: var(--fg-soft); }

.hero {
  padding: 6rem 0 4rem;
  background:
    linear-gradient(180deg, rgba(124, 140, 255, 0.14), transparent 70%),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 88px);
  border-bottom: 1px solid var(--line);
}
.hero .wrap { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
.hero img { width: 84px; height: 84px; border-radius: 19px; border: 1px solid var(--line); }
.hero h1 {
  margin: 0 0 0.5rem;
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  letter-spacing: -0.035em;
  font-weight: 650;
  line-height: 1.2;
}
.hero p { margin: 0; color: var(--fg-soft); max-width: 30rem; }
.cta {
  display: inline-block; margin-top: 1.5rem;
  padding: 0.55rem 1.4rem; border-radius: 8px;
  background: var(--fg); color: var(--bg);
  font-size: 0.88rem; font-weight: 600; text-decoration: none;
  transition: opacity 0.2s ease;
}
.cta:hover { opacity: 0.85; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.stat { padding: 2.25rem 1.5rem; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat .k { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-soft); }
.stat .v { font-size: clamp(1.6rem, 4.5vw, 2.4rem); letter-spacing: -0.03em; margin-top: 0.25rem; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; padding-block: 4.5rem; align-items: center; }
.split h2 { margin: 0 0 1rem; font-size: 1.3rem; letter-spacing: -0.02em; }
.split ul { margin: 0; padding-left: 1.1rem; color: var(--fg-soft); }
.split li { margin-bottom: 0.5rem; }
.split img { width: 100%; border-radius: 14px; border: 1px solid var(--line); }

.shots { display: flex; gap: 1rem; justify-content: safe center; overflow-x: auto; padding-bottom: 4.5rem; scroll-snap-type: x mandatory; }
.shots img {
  height: 420px; border-radius: 14px; border: 1px solid var(--line);
  flex: none; scroll-snap-align: start;
}

.strip { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); }
.strip .wrap { padding: 2rem 1.5rem; font-size: 0.88rem; color: var(--fg-soft); }

.foot { padding-block: 2.5rem 4rem; font-size: 0.82rem; color: var(--fg-soft); }
.foot p { margin: 0.4rem 0; }

@media (max-width: 720px) {
  .split { grid-template-columns: 1fr; gap: 2rem; }
  .stats { grid-template-columns: 1fr; }
  .stat { border-right: 0; border-bottom: 1px solid var(--line); }
  .shots img { height: 340px; }
}
.shots::after { content: ""; flex: 0 0 0.5rem; }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="home" href="../">← Holy App</a>
    <a href="https://apps.apple.com/jp/app/id892765668">App Store</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <img src="../assets/icons/average100.png" alt="" width="84" height="84">
    <div>
      <h1>平均点のための計算機</h1>
      <p>数字を入力するだけ。合計・人数・平均が、打ち終わった瞬間に出ています。</p>
      <a class="cta" href="https://apps.apple.com/jp/app/id892765668">App Store で見る</a>
    </div>
  </div>
</header>

<section class="stats">
  <div class="stat"><div class="k">合計</div><div class="v mono">1,284</div></div>
  <div class="stat"><div class="k">人数</div><div class="v mono">18</div></div>
  <div class="stat"><div class="k">平均</div><div class="v mono">71.33</div></div>
</section>

<section class="wrap split">
  <div>
    <h2>打つ、直す、並べ替える</h2>
    <ul>
      <li>入力した数字はあとから編集・削除できる</li>
      <li>並べ替えに対応。順位表示もできる</li>
      <li>テストの採点、集計、日常の平均計算に</li>
      <li>電卓を出して足し算をやり直す必要がない</li>
    </ul>
  </div>
  <img src="../assets/shots/average100-1.jpg" alt="数字を入力してすばやく平均を出す画面" loading="lazy">
</section>

<div class="wrap">
  <div class="shots">
    <img src="../assets/shots/average100-2.jpg" alt="入力した数字の一覧" loading="lazy">
    <img src="../assets/shots/average100-3.jpg" alt="合計・人数・平均の自動計算" loading="lazy">
  </div>
</div>

<section class="strip">
  <div class="wrap">無料版では広告が表示されます。</div>
</section>

<footer class="foot wrap">
  <p><a href="../">Holy App のアプリ一覧</a></p>
  <p>&copy; 2026 Holy App</p>
</footer>

</body>
</html>
