<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>片仮名ボード | Holy App</title>
<meta name="description" content="さわると声が出る、カタカナの50音表アプリ。">
<!-- 参考: スイススタイル / バウハウスのポスター。赤・黒・白、太いグリッド、幾何学。
     カタカナは直線と角でできた文字なので、その造形をそのままレイアウトの原理にした。 -->
<style>
:root {
  --paper: #f2f2f0;
  --ink: #1a1a1a;
  --red: #e03127;
  --line: rgba(26, 26, 26, 0.16);
  /* 実機の五十音表アプリで実際に使われている5色。段（アカサタナ…）ごとに
     この順で繰り返す。ページ自体は赤・黒・白のスイス調で組んでいるが、
     表の中だけは実物と同じ配色にして、実機との対応が一目でわかるようにする。 */
  --k-blue: #2166ab;
  --k-green: #4f6f3f;
  --k-gold: #caa020;
  --k-brown: #7c4a12;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 960px; margin-inline: auto; padding-inline: 1.5rem; }

.nav { border-bottom: 2px solid var(--ink); }
.nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 54px; }
.nav a { text-decoration: none; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }

.hero { border-bottom: 2px solid var(--ink); }
.hero .wrap { display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: end; padding-block: 4.5rem 3rem; }
.hero h1 {
  margin: 0;
  font-size: clamp(3rem, 12vw, 7rem);
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 0.88;
}
.hero h1 .red { color: var(--red); }
.hero img { width: 96px; height: 96px; border-radius: 0; }

.meta { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 2px solid var(--ink); }
.meta div { padding: 1.1rem 1.5rem; border-right: 1px solid var(--line); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
.meta div:last-child { border-right: 0; }
.meta strong { display: block; font-size: 0.95rem; letter-spacing: 0; text-transform: none; margin-top: 0.15rem; }

.body { display: grid; grid-template-columns: 1.1fr 1fr; }
.body > div { padding: 3.5rem 1.5rem; }
.body .left { border-right: 1px solid var(--line); }
.body h2 { margin: 0 0 1rem; font-size: 1.4rem; letter-spacing: -0.02em; }
.body p { margin: 0 0 1rem; max-width: 30rem; }

.cta {
  display: inline-block; margin-top: 1rem;
  padding: 0.7rem 1.8rem; background: var(--red); color: #fff;
  font-weight: 700; font-size: 0.85rem; letter-spacing: 0.08em;
  text-transform: uppercase; text-decoration: none;
  transition: background 0.2s ease;
}
.cta:hover { background: var(--ink); }

/* 実機のカタカナボードは、行（アイウエオ）を縦に並べ、段（アカサタナハ…）を
   右から左へ配置する組み方になっている。以前のこのページは単純な五十音順の
   横書きグリッドで、実機とは違う並びだった。枠線はページ全体のスイス調グリッド
   に合わせ、文字色だけ実機と同じ5色を段ごとに繰り返す。 */
.grid50-scroll { overflow-x: auto; }
.grid50 {
  display: inline-flex;
  flex-direction: row-reverse;
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.grid50 .col { display: flex; flex-direction: column; }
.grid50 .col span {
  width: 2.6rem; height: 2.6rem;
  display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: 1.3rem; font-weight: 700;
}
.grid50 .c-red span { color: var(--red); }
.grid50 .c-blue span { color: var(--k-blue); }
.grid50 .c-green span { color: var(--k-green); }
.grid50 .c-gold span { color: var(--k-gold); }
.grid50 .c-brown span { color: var(--k-brown); }

.shots { display: flex; gap: 0; border-top: 2px solid var(--ink); }
.shots img { width: 50%; height: auto; display: block; }

.foot { border-top: 2px solid var(--ink); padding-block: 2rem 4rem; font-size: 0.8rem; letter-spacing: 0.04em; }
.foot p { margin: 0.4rem 0; }

@media (max-width: 720px) {
  .hero .wrap { grid-template-columns: 1fr; align-items: start; }
  .body { grid-template-columns: 1fr; }
  .body .left { border-right: 0; border-bottom: 1px solid var(--line); }
  .meta { grid-template-columns: 1fr; }
  .meta div { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="../">← Holy App</a>
    <a href="https://apps.apple.com/jp/app/id783514541">App Store</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <h1>カタ<span class="red">カナ</span><br>ボード</h1>
    <img src="../assets/icons/katakana.png" alt="" width="96" height="96">
  </div>
</header>

<section class="meta">
  <div>Category<strong>教育</strong></div>
  <div>Platform<strong>iPhone / iPad</strong></div>
  <div>Price<strong>無料</strong></div>
</section>

<section class="body">
  <div class="left">
    <h2>さわって、あそんで、覚えちゃおう。</h2>
    <p>カタカナの50音表です。文字を押すと声が流れます。入力した文字は再生ボタンでまとめて読み上げられます。</p>
    <p>操作はタッチだけ。設定も保存もありません。カタカナに興味を持ちはじめたお子さまに。</p>
    <a class="cta" href="https://apps.apple.com/jp/app/id783514541">App Store</a>
  </div>
  <div class="grid50-scroll">
    <div class="grid50" aria-hidden="true">
      <div class="col c-red"><span>ア</span><span>イ</span><span>ウ</span><span>エ</span><span>オ</span></div>
      <div class="col c-blue"><span>カ</span><span>キ</span><span>ク</span><span>ケ</span><span>コ</span></div>
      <div class="col c-green"><span>サ</span><span>シ</span><span>ス</span><span>セ</span><span>ソ</span></div>
      <div class="col c-gold"><span>タ</span><span>チ</span><span>ツ</span><span>テ</span><span>ト</span></div>
      <div class="col c-brown"><span>ナ</span><span>ニ</span><span>ヌ</span><span>ネ</span><span>ノ</span></div>
      <div class="col c-red"><span>ハ</span><span>ヒ</span><span>フ</span><span>ヘ</span><span>ホ</span></div>
      <div class="col c-blue"><span>マ</span><span>ミ</span><span>ム</span><span>メ</span><span>モ</span></div>
      <div class="col c-green"><span>ヤ</span><span></span><span>ユ</span><span></span><span>ヨ</span></div>
      <div class="col c-gold"><span>ラ</span><span>リ</span><span>ル</span><span>レ</span><span>ロ</span></div>
      <div class="col c-brown"><span>ワ</span><span>ヲ</span><span></span><span></span><span>ン</span></div>
      <div class="col c-red"><span>ャ</span><span>ッ</span><span>ュ</span><span>ー</span><span>ョ</span></div>
    </div>
  </div>
</section>

<div class="shots">
  <img src="../assets/shots/katakana-1.jpg" alt="50音表の画面" loading="lazy">
  <img src="../assets/shots/katakana-2.jpg" alt="文字を押して再生" loading="lazy">
</div>

<footer class="foot wrap">
  <p><a href="../">Holy App のアプリ一覧</a></p>
  <p>&copy; 2026 Holy App</p>
</footer>

</body>
</html>
